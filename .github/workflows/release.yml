name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verificar executáveis
        shell: bash
        run: |
          for file in dist/ThunderUpdater-x86.exe dist/ThunderUpdater-x64.exe; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Executável ausente ou vazio: $file"
              exit 1
            fi
          done

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ThunderUpdater-x86.exe
            dist/ThunderUpdater-x64.exe
