name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da Release (ex.: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Definir e validar versão
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_VERSION"
          else
            RELEASE_TAG="$REF_NAME"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida: $RELEASE_TAG. Use o formato v1.0.0."
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Criar tag da execução manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A tag $RELEASE_TAG já existe."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Configurar Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar toolchains Windows CGO
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64

      - name: Compilar Windows x86
        env:
          CC: i686-w64-mingw32-gcc
        run: ./build/build-x86.sh

      - name: Compilar Windows x64
        env:
          CC: x86_64-w64-mingw32-gcc
        run: ./build/build-x64.sh

      - name: Verificar executáveis
        run: test -f dist/ThunderUpdater-x86.exe && test -f dist/ThunderUpdater-x64.exe

      - name: Criar ou atualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/ThunderUpdater-x86.exe \
              dist/ThunderUpdater-x64.exe \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/ThunderUpdater-x86.exe \
              dist/ThunderUpdater-x64.exe \
              --title "ThunderUpdater $RELEASE_TAG" \
              --generate-notes
          fi
